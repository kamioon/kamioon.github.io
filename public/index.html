<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png"/>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <link rel="sitemap" type="application/xml" href="%PUBLIC_URL%/sitemap.xml"/>
    <title>Kamran Azari</title>
    <!-- Page-specific title, description, canonical and social tags are added at build time by scripts/prerender.mjs -->
    <script type="text/javascript">
        // Old links used the spa-github-pages "/?/path" format; send them to the real (prerendered) URL.
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                l.replace(l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location))
    </script>
</head>
<body>
<div id="root"></div>
</body>
</html>
